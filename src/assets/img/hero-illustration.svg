<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Geospatial annotation pipeline illustration">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3cc"/>
      <stop offset="60%" stop-color="#ffe695"/>
      <stop offset="100%" stop-color="#ff8e6d"/>
    </linearGradient>
    <linearGradient id="hSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94d0e6"/>
      <stop offset="100%" stop-color="#1f779e"/>
    </linearGradient>
    <linearGradient id="hLand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43b7a5"/>
      <stop offset="100%" stop-color="#14826f"/>
    </linearGradient>
    <linearGradient id="hRoi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd862"/>
      <stop offset="100%" stop-color="#f6b21e"/>
    </linearGradient>
    <radialGradient id="hSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5e1"/>
      <stop offset="60%" stop-color="#ffc73a"/>
      <stop offset="100%" stop-color="#f06a48" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Rounded panel -->
  <rect x="10" y="10" width="500" height="400" rx="28" fill="#ffffff" stroke="rgba(31,119,158,0.18)"/>

  <!-- Sky/sea backdrop -->
  <clipPath id="panelClip"><rect x="10" y="10" width="500" height="400" rx="28"/></clipPath>
  <g clip-path="url(#panelClip)">
    <rect x="10" y="10" width="500" height="220" fill="url(#hSky)"/>
    <circle cx="260" cy="200" r="78" fill="url(#hSun)"/>
    <rect x="10" y="220" width="500" height="200" fill="url(#hSea)"/>

    <!-- Distant land silhouette -->
    <path d="M10,250 C 60,236 110,256 160,244 S 280,228 340,250 S 460,238 510,252 L 510,300 L 10,300 Z"
          fill="url(#hLand)" opacity="0.85"/>

    <!-- Sea highlights -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-linecap="round">
      <path d="M30 330 q 30 -8 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0" stroke-width="1.4"/>
      <path d="M30 360 q 30 -6 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0" stroke-width="1.1"/>
      <path d="M30 390 q 30 -5 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0" stroke-width="0.9"/>
    </g>

    <!-- Annotation grid overlay -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8">
      <line x1="100" y1="100" x2="100" y2="280"/>
      <line x1="180" y1="100" x2="180" y2="280"/>
      <line x1="260" y1="100" x2="260" y2="280"/>
      <line x1="340" y1="100" x2="340" y2="280"/>
      <line x1="420" y1="100" x2="420" y2="280"/>
      <line x1="40"  y1="140" x2="480" y2="140"/>
      <line x1="40"  y1="200" x2="480" y2="200"/>
      <line x1="40"  y1="260" x2="480" y2="260"/>
    </g>
  </g>

  <!-- Annotation bounding boxes -->
  <g>
    <rect x="78" y="120" width="120" height="78" rx="6" fill="rgba(255, 216, 98, 0.22)"
          stroke="url(#hRoi)" stroke-width="2.5" stroke-dasharray="6 4"/>
    <g fill="#fff" stroke="#f6b21e" stroke-width="1.4">
      <rect x="74" y="116" width="8" height="8" rx="1.5"/>
      <rect x="194" y="116" width="8" height="8" rx="1.5"/>
      <rect x="74" y="194" width="8" height="8" rx="1.5"/>
      <rect x="194" y="194" width="8" height="8" rx="1.5"/>
    </g>
    <text x="84" y="112" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="700" fill="#1a5d7c">building</text>
  </g>
  <g>
    <rect x="248" y="148" width="172" height="98" rx="6" fill="rgba(67, 183, 165, 0.18)"
          stroke="#43b7a5" stroke-width="2.5" stroke-dasharray="6 4"/>
    <g fill="#fff" stroke="#14826f" stroke-width="1.4">
      <rect x="244" y="144" width="8" height="8" rx="1.5"/>
      <rect x="416" y="144" width="8" height="8" rx="1.5"/>
      <rect x="244" y="242" width="8" height="8" rx="1.5"/>
      <rect x="416" y="242" width="8" height="8" rx="1.5"/>
    </g>
    <text x="252" y="140" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="700" fill="#14826f">vegetation</text>
  </g>

  <!-- Polygon annotation -->
  <g>
    <polygon points="120,275 165,270 195,295 175,330 130,332 105,305"
             fill="rgba(255, 142, 109, 0.25)" stroke="#f06a48" stroke-width="2.2"/>
    <g fill="#fff" stroke="#f06a48" stroke-width="1.4">
      <circle cx="120" cy="275" r="3.5"/>
      <circle cx="165" cy="270" r="3.5"/>
      <circle cx="195" cy="295" r="3.5"/>
      <circle cx="175" cy="330" r="3.5"/>
      <circle cx="130" cy="332" r="3.5"/>
      <circle cx="105" cy="305" r="3.5"/>
    </g>
  </g>

  <!-- Map pin -->
  <g transform="translate(330,260)">
    <path d="M0 0 c -8 0 -15 6.5 -15 14.8 0 11 15 24 15 24 s 15 -13 15 -24 c 0 -8.3 -7 -14.8 -15 -14.8 z"
          fill="#f06a48" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="14.8" r="5" fill="#fff"/>
  </g>
</svg>
