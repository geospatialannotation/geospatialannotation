<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Geospatial Annotation logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94d0e6"/>
      <stop offset="55%" stop-color="#43b7a5"/>
      <stop offset="100%" stop-color="#ffc73a"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8e6d"/>
      <stop offset="100%" stop-color="#f06a48"/>
    </linearGradient>
    <linearGradient id="rect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd862"/>
      <stop offset="100%" stop-color="#f6b21e"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>

  <!-- Contour / topographic lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 44 C 18 36, 28 42, 38 34 S 56 26, 58 20"/>
    <path d="M8 50 C 20 44, 30 48, 42 40 S 56 32, 60 28"/>
    <path d="M8 38 C 16 32, 24 36, 32 30 S 48 20, 56 14"/>
    <path d="M8 32 C 14 28, 20 30, 26 26"/>
  </g>

  <!-- Annotation bounding box (region of interest) -->
  <rect x="22" y="20" width="22" height="18" rx="2.5" fill="none" stroke="url(#rect)" stroke-width="2" stroke-dasharray="3 2.5"/>
  <!-- Corner anchors -->
  <g fill="#fff" stroke="#f6b21e" stroke-width="1">
    <rect x="20.5" y="18.5" width="3" height="3" rx="0.7"/>
    <rect x="42.5" y="18.5" width="3" height="3" rx="0.7"/>
    <rect x="20.5" y="36.5" width="3" height="3" rx="0.7"/>
    <rect x="42.5" y="36.5" width="3" height="3" rx="0.7"/>
  </g>

  <!-- Map pin centered in the ROI -->
  <g>
    <path d="M33 22 c -4.2 0 -7.5 3.3 -7.5 7.4 0 5.5 7.5 12 7.5 12 s 7.5 -6.5 7.5 -12 c 0 -4.1 -3.3 -7.4 -7.5 -7.4 z"
          fill="url(#pin)" stroke="#fff" stroke-width="1.4"/>
    <circle cx="33" cy="29.4" r="2.4" fill="#fff"/>
  </g>
</svg>
